[package]
name = "project-hub-git"
description = "Git integration for Project Hub"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
project-hub-domain = { workspace = true }
git2 = { version = "0.20", features = ["vendored-libgit2"] }
# Ensure vendored OpenSSL for cross-target builds (e.g. aarch64 → x86_64 macOS)
openssl-sys = { version = "0.9", features = ["vendored"] }
serde = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
