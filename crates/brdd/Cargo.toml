[package]
name = "project-hub-brdd"
description = "Per-project .brdd folder: brief analysis, version snapshots, changelog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
project-hub-domain = { workspace = true }
project-hub-git = { workspace = true }
project-hub-executor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
uuid = { workspace = true }
